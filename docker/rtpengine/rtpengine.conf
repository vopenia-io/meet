[rtpengine]
# Userspace forwarding (no kernel module in Docker)
table = -1

# Network interface
interface = 192.168.0.10

# Control socket for Kamailio (ng protocol)
listen-ng = 192.168.0.10:22222

# RTP port range (LiveKit-SIP uses 10000-19999, so we use 20000+)
port-min = 20000
port-max = 22221

# Timeouts
timeout = 60
silent-timeout = 3600

# Jitter buffer - handles packet reordering and timing
jitter-buffer = 10
jb-clock-drift

# QoS - Expedited Forwarding for RTP traffic
tos = 184

# Logging - production level (6=INFO, 5=NOTICE, 4=WARNING)
log-level = 5
foreground = true
log-stderr = true
