#!KAMAILIO
#!substdef "!MY_IP_ADDR!$env(MY_IP_ADDR)!g"
#!substdef "!LIVEKIT_SIP_ADDR!$env(LIVEKIT_SIP_ADDR)!g"
#!substdef "!KAMAILIO_DB_URL!$env(KAMAILIO_DB_URL)!g"
##############################################################################
# Kamailio Configuration Template for K8s Deployment
# - IPPI trunk: DIDs +33 5 35 00 59 42, +33 1 77 45 54 39
# - Registrar: Video conference SIP devices (with BFCP support)
# - Route to: LiveKit-SIP
#
# Required Environment Variables:
#   MY_IP_ADDR       - Kamailio's IP address (e.g., 192.168.0.10)
#   LIVEKIT_SIP_ADDR - LiveKit-SIP server address (e.g., 192.168.0.10)
#   KAMAILIO_DB_URL  - PostgreSQL connection URL
##############################################################################

#### Core Settings
log_stderror=yes
debug=2
log_facility=LOG_LOCAL0
fork=yes
children=4

#### TCP Settings (required for BFCP support - must be before modules)
disable_tcp=no
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_max_connections=2048

#### Network
listen=udp:MY_IP_ADDR:5060 advertise MY_IP_ADDR:5060
listen=tcp:MY_IP_ADDR:5060 advertise MY_IP_ADDR:5060

#### Modules
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "ctl.so"
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "uac.so"


#### Module Parameters
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("rr", "enable_full_lr", 1)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_contacts", 10)

# Auth DB Parameters (subscriber table)
modparam("auth_db", "db_url", "KAMAILIO_DB_URL")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "use_domain", 1)
modparam("auth_db", "version_table", 0)

# UAC Registration Parameters (uacreg table for IPPI trunk)
modparam("uac", "reg_db_url", "KAMAILIO_DB_URL")
modparam("uac", "reg_db_table", "kamailio.uacreg")
modparam("uac", "reg_contact_addr", "MY_IP_ADDR:5060")
modparam("uac", "reg_timer_interval", 90)
modparam("uac", "reg_retry_interval", 30)
modparam("uac", "reg_active", 1)
modparam("uac", "reg_keep_callid", 1)

# UAC Credentials for outbound authentication (used by uac_auth())
# Format: "username:password@realm"
# Note: Password contains special chars - use auth_ha1 AVP approach instead
modparam("uac", "auth_realm_avp", "$avp(uac_realm)")
modparam("uac", "auth_username_avp", "$avp(uac_user)")
modparam("uac", "auth_password_avp", "$avp(uac_pass)")

#### Main Request Route
request_route {
    # Skip logging for IPPI OPTIONS keepalives
    if (!(is_method("OPTIONS") && ($si =~ "^91\.194\." || $si =~ "^185\.47\." || $si =~ "^194\.169\.214\."))) {
        xlog("L_INFO", ">>> $rm $ru (From: $fu, SrcIP: $si:$sp, Transport: $proto)\n");
    }

    # Sanity checks
    if (!mf_process_maxfwd_header("70")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "Malformed message\n");
        exit;
    }

    # IPPI trunk: Check source IP (update with actual IPPI IPs)
    if ($si =~ "^91\.194\." || $si =~ "^185\.47\." || $si =~ "^194\.169\.214\.") {
        route(FROM_IPPI);
        exit;
    }

    # CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        } else {
            sl_send_reply("481", "Transaction Does Not Exist");
        }
        exit;
    }

    # In-dialog requests
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # Record-Route for dialog-creating requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # REGISTER
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    # OPTIONS keepalive
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # INVITE from registered devices
    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

#### Route: WITHINDLG - In-dialog requests
route[WITHINDLG] {
    xlog("L_INFO", "=== WITHINDLG: $rm from $si to $ru ===\n");
    xlog("L_INFO", "  From: $fu\n");
    xlog("L_INFO", "  To: $tu\n");
    xlog("L_INFO", "  Call-ID: $ci\n");
    xlog("L_INFO", "  CSeq: $cs $rm\n");
    xlog("L_INFO", "  Route headers: $hdr(Route)\n");
    xlog("L_INFO", "  Request-URI: $ru\n");

    # Handle ACK from IPPI without Route headers BEFORE loose_route()
    # IPPI sends ACK to Record-Route address (Kamailio) instead of Contact (livekit-sip)
    # loose_route() fails because ACK has no Route headers, so we handle it here
    xlog("L_INFO", "  DEBUG: Checking ACK condition: is_method(ACK)=$rm, Route_present=?\n");
    if (is_method("ACK")) {
        xlog("L_INFO", "  DEBUG: Is ACK. Checking Route header presence...\n");
        if (!is_present_hf("Route")) {
            xlog("L_INFO", "  DEBUG: No Route header. Checking source IP: $si\n");
            if ($si =~ "^91\.194\." || $si =~ "^185\.47\." || $si =~ "^194\.169\.214\.") {
                xlog("L_INFO", "  *** ACK from IPPI without Route - forwarding to LiveKit-SIP ***\n");
                $du = "sip:LIVEKIT_SIP_ADDR:5080;transport=tcp";
                xlog("L_INFO", "  Set destination: $du\n");
                if (!t_relay()) {
                    xlog("L_ERR", "  t_relay() FAILED for ACK to LiveKit-SIP\n");
                } else {
                    xlog("L_INFO", "  t_relay() succeeded for ACK to LiveKit-SIP\n");
                }
                exit;
            } else {
                xlog("L_INFO", "  DEBUG: Source IP $si not from IPPI\n");
            }
        } else {
            xlog("L_INFO", "  DEBUG: Route header IS present\n");
        }
    }

    if (loose_route()) {
        xlog("L_INFO", "  loose_route() succeeded\n");
        xlog("L_INFO", "  Request-URI after loose_route: $ru\n");
        xlog("L_INFO", "  Route headers after loose_route: $hdr(Route)\n");
        xlog("L_INFO", "  Destination: $du\n");

        if (is_method("ACK")) {
            xlog("L_INFO", "  Forwarding ACK to $ru\n");
            t_relay();
            exit;
        }

        if (is_method("BYE")) {
            xlog("L_INFO", "  BYE - call termination to $ru\n");
        }

        if (is_method("INVITE")) {
            xlog("L_INFO", "  re-INVITE - media renegotiation\n");
            xlog("L_INFO", "  Will forward to Request-URI: $ru\n");
            xlog("L_INFO", "  Source IP: $si:$sp\n");
            xlog("L_INFO", "  Content-Length: $hdr(Content-Length)\n");
        }

        if (is_method("UPDATE")) {
            xlog("L_INFO", "  UPDATE - session refresh\n");
        }

        if (is_method("INFO")) {
            xlog("L_INFO", "  INFO (Content-Type: $hdr(Content-Type))\n");
            # Check if LiveKit-SIP supports INFO, if not absorb it here
            if ($hdr(Content-Type) =~ "application/media_control") {
                xlog("L_INFO", "  Polycom FECC (camera control) - absorbing INFO message\n");
                sl_send_reply("200", "OK");
                exit;
            }
        }

        if (is_method("NOTIFY")) {
            xlog("L_INFO", "  NOTIFY (Event: $hdr(Event))\n");
        }

        if (is_method("REFER")) {
            xlog("L_INFO", "  REFER (Refer-To: $hdr(Refer-To))\n");
        }

        xlog("L_INFO", "  Calling t_relay() to forward $rm to $ru\n");
        if (!t_relay()) {
            xlog("L_ERR", "  t_relay() FAILED for $rm\n");
            sl_reply_error();
        } else {
            xlog("L_INFO", "  t_relay() succeeded for $rm\n");
        }
        exit;
    } else {
        xlog("L_WARN", "  loose_route() FAILED - no Route headers or routing failed\n");
    }

    # ACK without Route from non-IPPI sources - absorb silently
    if (is_method("ACK")) {
        xlog("L_INFO", "  Absorbing ACK without Route from $si\n");
        exit;
    }

    # BYE/NOTIFY without Route - try direct relay
    if (is_method("BYE|NOTIFY")) {
        t_relay();
        exit;
    }

    sl_send_reply("481", "Call/Transaction Does Not Exist");
}

#### Route: REGISTRAR - SIP device registration with authentication
route[REGISTRAR] {
    xlog("L_INFO", "REGISTER from $fu (Contact: $ct)\n");

    # Check if Authorization header is present
    if (!is_present_hf("Authorization")) {
        xlog("L_INFO", "No Authorization header - sending 401 challenge to $fU@$fd\n");
        www_challenge("MY_IP_ADDR", "0");
        exit;
    }

    # Authenticate against subscriber table
    if (!www_authenticate("MY_IP_ADDR", "kamailio.subscriber")) {
        switch ($rc) {
            case -1:
                xlog("L_WARN", "Authentication failed for $fU@$fd - invalid credentials\n");
                www_challenge("MY_IP_ADDR", "0");
                exit;
            case -2:
                xlog("L_ERR", "Authentication error for $fU@$fd - internal error\n");
                sl_send_reply("500", "Internal Server Error");
                exit;
            case -3:
                xlog("L_INFO", "Authentication required for $fU@$fd - sending challenge\n");
                www_challenge("MY_IP_ADDR", "0");
                exit;
        }
    }

    # Consume credentials to populate $au
    consume_credentials();

    # Authentication successful - check if authenticated user matches From user
    if ($au != $fU) {
        xlog("L_WARN", "Auth user $au does not match From user $fU\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # Save location
    if (!save("location")) {
        sl_send_reply("500", "Error saving location");
        exit;
    }

    xlog("L_INFO", "Registered: $fu (authenticated as $au)\n");
    exit;
}

#### Route: FROM_IPPI - IPPI trunk calls
route[FROM_IPPI] {
    # OPTIONS keepalive - handle silently (no logging)
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    xlog("L_INFO", "IPPI: Caller=$fU Called=$rU\n");

    # Only accept our DIDs or ippi-trunk
    # DID 1: +33535005942, DID 2: +33177455439
    if ($rU != "33535005942" && $rU != "+33535005942" && $rU != "0535005942" &&
        $rU != "33177455439" && $rU != "+33177455439" && $rU != "0177455439" &&
        $rU != "ippi-trunk") {
        xlog("L_WARN", "Unknown DID: $rU\n");
        sl_send_reply("404", "Number Not Found");
        exit;
    }

    # Log BFCP if present (for video conferencing)
    if (has_body("application/sdp")) {
        if (search_body("m=application")) {
            xlog("L_INFO", "BFCP media line detected\n");
        }
        if (search_body("m=video")) {
            xlog("L_INFO", "Video call detected\n");
        }
    }

    # In-dialog requests
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # Initial INVITE
    if (is_method("INVITE")) {
        record_route();
        route(TO_LIVEKIT_SIP);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

#### Route: INVITE - From registered devices
route[INVITE] {
    xlog("L_INFO", "INVITE to $rU\n");

    # Log BFCP/media information if present
    if (has_body("application/sdp")) {
        # Log the full SDP for debugging
        xlog("L_INFO", "=== SDP BODY START ===\n$rb\n=== SDP BODY END ===\n");

        if (search_body("m=application.*BFCP")) {
            xlog("L_INFO", "*** BFCP DETECTED in INVITE from registered device ***\n");
        }
        if (search_body("m=application.*TCP/BFCP")) {
            xlog("L_INFO", "*** BFCP over TCP detected ***\n");
        }
        if (search_body("m=application")) {
            xlog("L_INFO", "m=application line found (check if BFCP or H.224)\n");
        }
        if (search_body("m=video")) {
            xlog("L_INFO", "Video call from registered device\n");
        }
    }

    # PIN detection and routing logic for registered devices
    # Case 1: PIN detected (numeric, 1-10 digits) - Route to LiveKit-SIP with X-PIN header
    if ($rU =~ "^[0-9]{1,10}$") {
        xlog("L_INFO", "PIN detected: $rU - routing to LiveKit-SIP\n");

        # Store PIN in variable
        $var(pin) = $rU;

        # Add X-PIN header
        append_hf("X-PIN: $var(pin)\r\n");

        # Rewrite Request-URI to gw+@livekit-sip
        $ru = "sip:gw+@LIVEKIT_SIP_ADDR:5080;transport=tcp";

        xlog("L_INFO", "Routing PIN $var(pin) to LiveKit-SIP: $ru\n");

        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    # Case 2: Valid phone number detected - Outbound call
    if ($rU =~ "^\+[0-9]{1,15}$" || $rU =~ "^0[0-9]{9,}$" || $rU =~ "^[0-9]{11,}$") {
        xlog("L_INFO", "Valid phone number detected: $rU - treating as outbound call\n");

        # Check if destination is registered locally
        if (lookup("location")) {
            xlog("L_INFO", "Calling registered device: $ru\n");
            t_relay();
            exit;
        }

        # Outbound call to PSTN via IPPI trunk
        xlog("L_INFO", "Outbound call to $rU - routing via IPPI trunk\n");
        route(TO_IPPI);
        exit;
    }

    # Case 3: Invalid format
    xlog("L_WARN", "Invalid destination format: $rU\n");
    sl_send_reply("484", "Address Incomplete");
    exit;
}

#### Route: TO_LIVEKIT_SIP - Forward to LiveKit-SIP
route[TO_LIVEKIT_SIP] {
    # LiveKit-SIP destination - force TCP transport
    # Rewrite Request-URI to include transport parameter
    $ru = "sip:" + $rU + "@LIVEKIT_SIP_ADDR:5080;transport=tcp";

    xlog("L_INFO", "Routing to LiveKit-SIP via TCP: $ru\n");

    if (!t_relay()) {
        sl_reply_error();
    }
}

#### Route: TO_IPPI - Forward outbound calls to IPPI trunk
route[TO_IPPI] {
    # IPPI SIP proxy: sip.ippi.com
    # Use our registered caller ID (bsenard account)
    xlog("L_INFO", "TO_IPPI: Routing $rU to IPPI trunk\n");

    # Format the destination number for IPPI
    # Remove + prefix if present, IPPI expects numbers without +
    $var(dest) = $rU;
    if ($var(dest) =~ "^\+") {
        $var(dest) = $(rU{s.substr,1,0});
    }

    # Set destination to IPPI SIP proxy
    $ru = "sip:" + $var(dest) + "@sip.ippi.com";

    # Set From header to use IPPI account
    # The uac module will handle authentication when we get 401/407
    uac_replace_from("sip:bsenard@sip.ippi.com");

    xlog("L_INFO", "TO_IPPI: Sending INVITE to $ru (From: bsenard@sip.ippi.com)\n");

    # Set failure route for authentication challenges
    t_on_failure("IPPI_AUTH");

    if (!t_relay()) {
        xlog("L_ERR", "TO_IPPI: t_relay() failed\n");
        sl_reply_error();
    }
}

#### Failure Route: IPPI_AUTH - Handle authentication challenges from IPPI
failure_route[IPPI_AUTH] {
    xlog("L_INFO", "IPPI_AUTH: Received $rs $rr\n");

    # Handle 401 Unauthorized or 407 Proxy Authentication Required
    if (t_check_status("401|407")) {
        xlog("L_INFO", "IPPI_AUTH: Authentication challenge received, sending credentials\n");

        # Set IPPI credentials via AVPs (password contains special chars)
        $avp(uac_realm) = "ippi.fr";
        $avp(uac_user) = "bsenard";
        $avp(uac_pass) = "V0p3n1a\x2333";

        # Use uac_auth to respond to the challenge
        if (uac_auth()) {
            xlog("L_INFO", "IPPI_AUTH: Re-sending INVITE with authentication\n");
            t_on_failure("IPPI_AUTH");
            t_relay();
            exit;
        } else {
            xlog("L_ERR", "IPPI_AUTH: uac_auth() failed - realm=$avp(uac_realm) user=$avp(uac_user)\n");
        }
    }

    # Handle other failures
    if (t_check_status("403")) {
        xlog("L_WARN", "IPPI_AUTH: Call denied (403)\n");
    }
}

#### Reply Route
onreply_route {
    xlog("L_INFO", "<<< Reply: $rs $rr for $rm (To: $tu, From: $fu)\n");
    if (is_method("INVITE")) {
        xlog("L_INFO", "  INVITE response: $rs $rr\n");
        xlog("L_INFO", "  Call-ID: $ci\n");
        xlog("L_INFO", "  CSeq: $cs\n");
    }
}
