##############################################################################
# Route: INVITE - Initial INVITE handling
##############################################################################
route[INVITE] {
    xlog("L_INFO", "INVITE to $rU (Call-ID: $ci)\n");

    # Route PIN calls (1-10 digits) to LiveKit-SIP
    if ($rU =~ "^[0-9]{1,10}$") {
        $var(pin) = $rU;
        append_hf("X-PIN: $var(pin)\r\n");
        $ru = "sip:gw+@" + LIVEKIT_SIP_ADDR + ":5080;transport=tcp";

        if (has_body("application/sdp")) {
            $var(has_bfcp) = 0;
            if (search_body("TCP/BFCP")) {
                $var(has_bfcp) = 1;
            }
            # RTPEngine flags with SDP attribute preservation for RTCP-FB and BFCP
            $var(rtp_flags) = "replace-origin replace-session-connection ICE=remove media-handover original-sendrecv rtcp-mux-demux sdp-attr-rtcp-fb-keep sdp-attr-confid-keep sdp-attr-userid-keep sdp-attr-floorctrl-keep sdp-attr-floorid-keep";
            $var(rtp_result) = rtpengine_manage($var(rtp_flags));
            xlog("L_INFO", "RTPENGINE: initial INVITE processed (result=$var(rtp_result), Call-ID: $ci)\n");
        }

        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    # Route phone numbers to registered devices or external gateway
    if ($rU =~ "^\+[0-9]{1,15}$" || $rU =~ "^0[0-9]{9,}$" || $rU =~ "^[0-9]{11,}$") {
        if (lookup("location")) {
            t_relay();
            exit;
        }
        sl_send_reply("404", "Not Found");
        exit;
    }

    sl_send_reply("484", "Address Incomplete");
    exit;
}

##############################################################################
# Route: TO_LIVEKIT_SIP - Forward to LiveKit-SIP server
##############################################################################
route[TO_LIVEKIT_SIP] {
    $ru = "sip:" + $rU + "@" + LIVEKIT_SIP_ADDR + ":5080;transport=tcp";
    xlog("L_INFO", "Routing to LiveKit-SIP: $ru\n");

    if (!t_relay()) {
        sl_reply_error();
    }
}

##############################################################################
# Reply Route - Process SIP responses
##############################################################################
onreply_route {
    xlog("L_INFO", "<<< Reply: $rs $rr for $rm (Call-ID: $ci)\n");

    if (is_method("INVITE")) {
        if (has_body("application/sdp")) {
            $var(has_bfcp) = 0;
            if (search_body("TCP/BFCP")) {
                $var(has_bfcp) = 1;
            }

            # RTPEngine flags with SDP attribute preservation for RTCP-FB and BFCP
            $var(rtp_flags) = "replace-origin replace-session-connection ICE=remove media-handover original-sendrecv asymmetric rtcp-mux-demux sdp-attr-rtcp-fb-keep sdp-attr-confid-keep sdp-attr-userid-keep sdp-attr-floorctrl-keep sdp-attr-floorid-keep";
            $var(rtp_result) = rtpengine_manage($var(rtp_flags));
            xlog("L_INFO", "RTPENGINE: response processed (result=$var(rtp_result), Call-ID: $ci)\n");

            # Fix BFCP: ensure TCP control goes directly to LiveKit-SIP
            if ($var(has_bfcp) == 1 && $si == LIVEKIT_SIP_ADDR) {
                route(FIX_BFCP);
            }
        }
    }
}

##############################################################################
# Route: FIX_BFCP - Add media-level connection for BFCP
#
# After RTPEngine rewrites the session-level c= line, BFCP (TCP) would
# incorrectly point to RTPEngine. This route adds a media-level c= line
# for the BFCP m= section to ensure TCP traffic goes directly to LiveKit-SIP.
##############################################################################
route[FIX_BFCP] {
    if (search_body("TCP/BFCP")) {
        subst_body("/(m=application [0-9]+ TCP\/BFCP [^\r\n]*)/\\1\r\nc=IN IP4 " + LIVEKIT_SIP_ADDR + "/g");
        msg_apply_changes();
        xlog("L_INFO", "BFCP: Added media-level c= line for direct TCP (Call-ID: $ci)\n");
    }
}
