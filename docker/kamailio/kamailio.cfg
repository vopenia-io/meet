#!KAMAILIO
#!define WITH_POSTGRES
#!defenvs MY_IP_ADDR
#!defenvs LIVEKIT_SIP_ADDR
#!defenvs KAMAILIO_DB_URL
#!defenvs RTPENGINE_ADDR
##############################################################################
# Kamailio Configuration
# - Registrar: Video conference SIP devices (with BFCP support)
# - Route to: LiveKit-SIP
#
# Required Environment Variables:
#   MY_IP_ADDR       - Kamailio's IP address (e.g., 192.168.0.10)
#   LIVEKIT_SIP_ADDR - LiveKit-SIP server address (e.g., 192.168.0.10)
#   KAMAILIO_DB_URL  - PostgreSQL connection URL
#   RTPENGINE_ADDR   - RTPEngine address (e.g., udp:148.253.73.224:22222)
##############################################################################

#### Core Settings
log_stderror=yes
debug=2
log_facility=LOG_LOCAL0
fork=yes
children=4

#### TCP Settings (required for BFCP support - must be before modules)
disable_tcp=no
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_max_connections=2048

#### Network
listen=udp:0.0.0.0:5060 advertise 0.0.0.0:5060
listen=tcp:0.0.0.0:5060 advertise 0.0.0.0:5060

#### Modules
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "ctl.so"
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "rtpengine.so"
loadmodule "textopsx.so"
loadmodule "sdpops.so"


#### Module Parameters
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("rr", "enable_full_lr", 1)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_contacts", 10)

# Auth DB Parameters (subscriber table)
modparam("auth_db", "db_url", KAMAILIO_DB_URL)
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "use_domain", 1)
modparam("auth_db", "version_table", 0)

# RTPEngine Parameters
modparam("rtpengine", "rtpengine_sock", RTPENGINE_ADDR)

#### Main Request Route
request_route {
    xlog("L_INFO", ">>> $rm $ru (From: $fu, SrcIP: $si:$sp, Transport: $proto)\n");

    # Sanity checks
    if (!mf_process_maxfwd_header("70")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "Malformed message\n");
        exit;
    }

    # CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        } else {
            sl_send_reply("481", "Transaction Does Not Exist");
        }
        exit;
    }

    # In-dialog requests
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # Record-Route for dialog-creating requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # REGISTER
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    # OPTIONS keepalive
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # INVITE from registered devices
    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

#### Route: WITHINDLG - In-dialog requests
route[WITHINDLG] {
    xlog("L_INFO", "=== WITHINDLG: $rm from $si to $ru ===\n");
    xlog("L_INFO", "  From: $fu\n");
    xlog("L_INFO", "  To: $tu\n");
    xlog("L_INFO", "  Call-ID: $ci\n");
    xlog("L_INFO", "  CSeq: $cs $rm\n");
    xlog("L_INFO", "  Route headers: $hdr(Route)\n");
    xlog("L_INFO", "  Request-URI: $ru\n");

    if (loose_route()) {
        xlog("L_INFO", "  loose_route() succeeded\n");
        xlog("L_INFO", "  Request-URI after loose_route: $ru\n");
        xlog("L_INFO", "  Route headers after loose_route: $hdr(Route)\n");
        xlog("L_INFO", "  Destination: $du\n");

        if (is_method("ACK")) {
            xlog("L_INFO", "  Forwarding ACK to $ru\n");
            t_relay();
            exit;
        }

        if (is_method("BYE")) {
            xlog("L_INFO", "  BYE - call termination to $ru\n");
            # RTPEngine: cleanup RTP session
            rtpengine_delete();
        }

        if (is_method("INVITE")) {
            xlog("L_INFO", "  re-INVITE - media renegotiation\n");
            xlog("L_INFO", "  Will forward to Request-URI: $ru\n");
            xlog("L_INFO", "  Source IP: $si:$sp\n");
            xlog("L_INFO", "  Request-URI domain: $rd\n");
            xlog("L_INFO", "  Content-Length: $hdr(Content-Length)\n");
            # RTPEngine: All UDP media goes through RTPEngine
            if (has_body("application/sdp")) {
                $var(has_bfcp) = 0;
                if (search_body("TCP/BFCP")) {
                    $var(has_bfcp) = 1;
                    xlog("L_INFO", ">>> BFCP detected in re-INVITE (Call-ID: $ci)\n");
                }
                if ($si == LIVEKIT_SIP_ADDR) {
                    xlog("L_INFO", ">>> RTPENGINE: re-INVITE from LiveKit-SIP (callee) (Call-ID: $ci)\n");
                    $var(rtp_result) = rtpengine_manage("replace-origin replace-session-connection ICE=remove media-handover original-sendrecv asymmetric");
                    xlog("L_INFO", ">>> RTPENGINE: rtpengine_manage result = $var(rtp_result) (Call-ID: $ci)\n");
                } else {
                    xlog("L_INFO", ">>> RTPENGINE: re-INVITE from Poly (caller) (Call-ID: $ci)\n");
                    $var(rtp_result) = rtpengine_manage("replace-origin replace-session-connection ICE=remove media-handover original-sendrecv asymmetric");
                    xlog("L_INFO", ">>> RTPENGINE: rtpengine_manage result = $var(rtp_result) (Call-ID: $ci)\n");
                }
            } else {
                xlog("L_WARN", ">>> No SDP body in re-INVITE (Call-ID: $ci)\n");
            }
        }

        if (is_method("UPDATE")) {
            xlog("L_INFO", "  UPDATE - session refresh\n");
        }

        if (is_method("INFO")) {
            xlog("L_INFO", "  INFO (Content-Type: $hdr(Content-Type))\n");
            # Check if LiveKit-SIP supports INFO, if not absorb it here
            if ($hdr(Content-Type) =~ "application/media_control") {
                xlog("L_INFO", "  Polycom FECC (camera control) - absorbing INFO message\n");
                sl_send_reply("200", "OK");
                exit;
            }
        }

        if (is_method("NOTIFY")) {
            xlog("L_INFO", "  NOTIFY (Event: $hdr(Event))\n");
        }

        if (is_method("REFER")) {
            xlog("L_INFO", "  REFER (Refer-To: $hdr(Refer-To))\n");
        }

        xlog("L_INFO", "  Calling t_relay() to forward $rm to $ru\n");
        if (!t_relay()) {
            xlog("L_ERR", "  t_relay() FAILED for $rm\n");
            sl_reply_error();
        } else {
            xlog("L_INFO", "  t_relay() succeeded for $rm\n");
        }
        exit;
    } else {
        xlog("L_WARN", "  loose_route() FAILED - no Route headers or routing failed\n");
    }

    # ACK without Route - absorb
    if (is_method("ACK")) {
        exit;
    }

    # BYE/NOTIFY without Route - try direct relay
    if (is_method("BYE|NOTIFY")) {
        t_relay();
        exit;
    }

    sl_send_reply("481", "Call/Transaction Does Not Exist");
}

