#### Route: INVITE - From registered devices
route[INVITE] {
    xlog("L_INFO", "INVITE to $rU\n");

    # Log media types for debugging
    if (has_body("application/sdp")) {
        if (search_body("TCP/BFCP")) {
            xlog("L_INFO", "*** BFCP DETECTED (Call-ID: $ci) ***\n");
        }
        if (search_body("m=video")) {
            xlog("L_INFO", "Video call from registered device\n");
        }
    }

    # PIN detection and routing logic for registered devices
    # Case 1: PIN detected (numeric, 1-10 digits) - Route to LiveKit-SIP with X-PIN header
    if ($rU =~ "^[0-9]{1,10}$") {
        xlog("L_INFO", "PIN detected: $rU - routing to LiveKit-SIP\n");

        # Store PIN in variable
        $var(pin) = $rU;

        # Add X-PIN header
        append_hf("X-PIN: $var(pin)\r\n");

        # Rewrite Request-URI to gw+@livekit-sip
        $ru = "sip:gw+@" + LIVEKIT_SIP_ADDR + ":5080;transport=tcp";

        xlog("L_INFO", "Routing PIN $var(pin) to LiveKit-SIP: $ru\n");

        # RTPEngine: All UDP media goes through RTPEngine
        # BFCP (TCP) connection info is fixed after RTPEngine to point directly to LiveKit-SIP
        if (has_body("application/sdp")) {
            $var(has_bfcp) = 0;
            if (search_body("TCP/BFCP")) {
                $var(has_bfcp) = 1;
                xlog("L_INFO", ">>> BFCP detected - will fix BFCP c= after RTPEngine (Call-ID: $ci)\n");
            }
            xlog("L_INFO", ">>> RTPENGINE: Processing initial INVITE SDP (Call-ID: $ci)\n");
            $var(rtp_result) = rtpengine_manage("replace-origin replace-session-connection ICE=remove media-handover original-sendrecv");
            xlog("L_INFO", ">>> RTPENGINE: rtpengine_manage result = $var(rtp_result) (Call-ID: $ci)\n");
        } else {
            xlog("L_WARN", ">>> No SDP body in initial INVITE (Call-ID: $ci)\n");
        }

        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    # Case 2: Valid phone number detected - Outbound call (NOT to LiveKit-SIP)
    if ($rU =~ "^\+[0-9]{1,15}$" || $rU =~ "^0[0-9]{9,}$" || $rU =~ "^[0-9]{11,}$") {
        xlog("L_INFO", "Valid phone number detected: $rU - treating as outbound call\n");

        # Check if destination is registered
        if (lookup("location")) {
            xlog("L_INFO", "Calling registered device: $ru\n");
            t_relay();
            exit;
        }

        # For true outbound calls, you would add your outbound routing logic here
        # For now, reject with appropriate message
        xlog("L_WARN", "Outbound call to $rU - no outbound route configured\n");
        sl_send_reply("404", "Not Found");
        exit;
    }

    # Case 3: Invalid format
    xlog("L_WARN", "Invalid destination format: $rU\n");
    sl_send_reply("484", "Address Incomplete");
    exit;
}

#### Route: TO_LIVEKIT_SIP - Forward to LiveKit-SIP
route[TO_LIVEKIT_SIP] {
    # LiveKit-SIP destination - force TCP transport
    # Rewrite Request-URI to include transport parameter
    $ru = "sip:" + $rU + "@" + LIVEKIT_SIP_ADDR + ":5080;transport=tcp";

    xlog("L_INFO", "Routing to LiveKit-SIP via TCP: $ru\n");

    if (!t_relay()) {
        sl_reply_error();
    }
}

#### Reply Route
onreply_route {
    xlog("L_INFO", "<<< Reply: $rs $rr for $rm (To: $tu, From: $fu, Source: $si:$sp)\n");
    if (is_method("INVITE")) {
        xlog("L_INFO", "  INVITE response: $rs $rr\n");
        xlog("L_INFO", "  Call-ID: $ci\n");
        xlog("L_INFO", "  CSeq: $cs\n");
        # RTPEngine: All UDP media goes through RTPEngine
        # BFCP (TCP) connection is fixed after RTPEngine to point directly to LiveKit-SIP
        if (has_body("application/sdp")) {
            $var(has_bfcp) = 0;
            if (search_body("TCP/BFCP")) {
                $var(has_bfcp) = 1;
                xlog("L_INFO", ">>> BFCP detected in response (Call-ID: $ci)\n");
            }
            if ($si == LIVEKIT_SIP_ADDR) {
                xlog("L_INFO", ">>> RTPENGINE: INVITE response from LiveKit-SIP (Call-ID: $ci)\n");
                $var(rtp_result) = rtpengine_manage("replace-origin replace-session-connection ICE=remove media-handover original-sendrecv asymmetric");
                xlog("L_INFO", ">>> RTPENGINE: rtpengine_manage result = $var(rtp_result) (Call-ID: $ci)\n");
                # Fix BFCP: Add media-level c= line pointing to LiveKit-SIP (not RTPEngine)
                # This ensures BFCP TCP connection goes directly to LiveKit-SIP
                if ($var(has_bfcp) == 1) {
                    route(FIX_BFCP);
                }
            } else {
                xlog("L_INFO", ">>> RTPENGINE: INVITE response from Poly (Call-ID: $ci)\n");
                $var(rtp_result) = rtpengine_manage("replace-origin replace-session-connection ICE=remove media-handover original-sendrecv asymmetric");
                xlog("L_INFO", ">>> RTPENGINE: rtpengine_manage result = $var(rtp_result) (Call-ID: $ci)\n");
            }
        } else {
            xlog("L_WARN", ">>> No SDP body in INVITE response (Call-ID: $ci)\n");
        }
    }
}

#### Route: FIX_BFCP - Fix BFCP connection after RTPEngine processing
# After RTPEngine rewrites session c= line to point to RTPEngine,
# we add a media-level c= line for BFCP so Poly connects directly to LiveKit-SIP for TCP BFCP.
# UDP media (audio/video/screenshare) still goes through RTPEngine.
route[FIX_BFCP] {
    if (search_body("TCP/BFCP")) {
        # Insert c= line after BFCP m= line pointing to LiveKit-SIP
        subst_body("/(m=application [0-9]+ TCP\/BFCP [^\r\n]*)/\\1\r\nc=IN IP4 " + LIVEKIT_SIP_ADDR + "/g");
        msg_apply_changes();
        xlog("L_INFO", ">>> BFCP: Added media-level c= line pointing to LiveKit-SIP (Call-ID: $ci)\n");
    }
}

