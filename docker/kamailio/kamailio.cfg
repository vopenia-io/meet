#!KAMAILIO
#!define WITH_POSTGRES
#!defenvs MY_IP_ADDR
#!defenvs SIP_REALM
#!defenvs SIP_ADVERTISE_IP
#!defenvs KAMAILIO_DB_URL
#!substdef "!DBURL!$env(KAMAILIO_DB_URL)!"
#!substdef "!ADVERTISE_IP!$env(SIP_ADVERTISE_IP)!"
##############################################################################
# Kamailio SIP Proxy Configuration
#
# Features:
#   - SIP Registrar with digest authentication
#   - RTPEngine media proxy integration with load balancing
#   - BFCP (Binary Floor Control Protocol) support for video conferencing
#   - PIN-based routing to LiveKit-SIP with dispatcher load balancing
#   - Database-backed dispatcher and rtpengine for hot reload
#
# Environment Variables:
#   MY_IP_ADDR       - Kamailio public IP address
#   KAMAILIO_DB_URL  - PostgreSQL connection URL
#
# Database Tables:
#   dispatcher - LiveKit-SIP server destinations (hot reload with kamcmd dispatcher.reload)
#   rtpengine  - RTPEngine server destinations (hot reload with kamcmd rtpengine.reload)
##############################################################################

##############################################################################
# Core Settings
##############################################################################
log_stderror=yes
debug=2
log_facility=LOG_LOCAL0
fork=yes
children=4

##############################################################################
# TCP Settings (required for BFCP)
##############################################################################
disable_tcp=no
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_max_connections=2048

##############################################################################
# Network Listeners
##############################################################################
listen=udp:0.0.0.0:5060 advertise SIP_ADVERTISE_IP:5060
listen=tcp:0.0.0.0:5060 advertise SIP_ADVERTISE_IP:5060

##############################################################################
# Modules
##############################################################################
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "ctl.so"
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "rtpengine.so"
loadmodule "textopsx.so"
loadmodule "sdpops.so"
loadmodule "nathelper.so"
loadmodule "dispatcher.so"
loadmodule "sqlops.so"
loadmodule "dialog.so"

##############################################################################
# Module Parameters
##############################################################################
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("rr", "enable_full_lr", 1)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_contacts", 10)

modparam("auth_db", "db_url", KAMAILIO_DB_URL)
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "use_domain", 1)
modparam("auth_db", "version_table", 0)

# Dispatcher module - database mode for hot reload
modparam("dispatcher", "db_url", KAMAILIO_DB_URL)
modparam("dispatcher", "table_name", "dispatcher")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_probing_threshold", 3)

# RTPEngine module - database mode for hot reload
modparam("rtpengine", "db_url", KAMAILIO_DB_URL)
modparam("rtpengine", "table_name", "rtpengine")
modparam("rtpengine", "setid_default", 1)

# SQLOps module - for querying VM count from database
modparam("sqlops", "sqlcon", "db=>DBURL")

# Dialog module - for persisting variables across dialog (needed for BFCP IP)
modparam("dialog", "db_mode", 0)

##############################################################################
# Main Request Route
##############################################################################
request_route {
    xlog("L_INFO", ">>> $rm $ru (From: $fu, SrcIP: $si:$sp, Transport: $proto)\n");

    if (!mf_process_maxfwd_header("70")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "Malformed message\n");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        } else {
            sl_send_reply("481", "Transaction Does Not Exist");
        }
        exit;
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

##############################################################################
# Route: WITHINDLG - In-dialog request handling
##############################################################################
route[WITHINDLG] {
    xlog("L_INFO", "WITHINDLG: $rm (Call-ID: $ci)\n");

    if (loose_route()) {
        if (is_method("ACK")) {
            # Handle delayed offer: ACK may contain SDP answer
            if (has_body("application/sdp")) {
                xlog("L_INFO", "ACK with SDP (delayed offer answer) - processing with RTPEngine (Call-ID: $ci)\n");
                if ($dlg_var(current_set)) {
                    set_rtpengine_set($dlg_var(current_set));
                }
                # For delayed offer, the ACK contains the answer
                $var(rtp_flags) = "replace-origin ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address";
                $var(rtp_result) = rtpengine_answer($var(rtp_flags));
                xlog("L_INFO", "RTPENGINE: ACK answer processed (set=$dlg_var(current_set), result=$var(rtp_result), Call-ID: $ci)\n");
            }
            t_relay();
            exit;
        }

        if (is_method("BYE")) {
            rtpengine_delete();
        }

        if (is_method("INVITE")) {
            if (has_body("application/sdp")) {
                # Extract TCP/BFCP port before RTPEngine processing
                $avp(original_bfcp_port) = $null;
                if (search_body("TCP/BFCP")) {
                    $var(bfcp_match) = $(rb{re.subst,/.*m=application ([0-9]+) TCP\/BFCP.*/\1/s});
                    if ($var(bfcp_match) != $rb) {
                        $avp(original_bfcp_port) = $var(bfcp_match);
                        xlog("L_INFO", "BFCP: Saved original port $avp(original_bfcp_port) for re-INVITE (Call-ID: $ci)\n");
                    }
                }

                $var(rtp_flags) = "replace-origin ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address";
                $var(rtp_result) = rtpengine_manage($var(rtp_flags));
                xlog("L_INFO", "RTPENGINE: re-INVITE processed (result=$var(rtp_result), Call-ID: $ci)\n");

                # Apply RTPEngine changes before BFCP port restoration
                msg_apply_changes();

                # Restore TCP/BFCP port after RTPEngine
                if (search_body("TCP/BFCP")) {
                    route(FIX_BFCP);
                }
            }
        }

        if (is_method("INFO")) {
            if ($hdr(Content-Type) =~ "application/media_control") {
                sl_send_reply("200", "OK");
                exit;
            }
        }

        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    if (is_method("ACK")) {
        exit;
    }

    if (is_method("BYE|NOTIFY")) {
        t_relay();
        exit;
    }

    sl_send_reply("481", "Call/Transaction Does Not Exist");
}

##############################################################################
# Route: REGISTRAR - SIP device registration
##############################################################################
route[REGISTRAR] {
    xlog("L_INFO", "REGISTER from $fu (Contact: $ct)\n");
    xlog("L_DEBUG", "REGISTRAR: From-User=$fU, Auth-User=$au, Domain=$fd, Source=$si:$sp\n");

    # Authentication
    if (!is_present_hf("Authorization")) {
        xlog("L_INFO", "REGISTRAR: No Authorization header, sending challenge\n");
        www_challenge(SIP_REALM, "0");
        exit;
    }

    xlog("L_DEBUG", "REGISTRAR: Authorization header present, authenticating user=$au\n");

    if (!www_authenticate(SIP_REALM, "subscriber")) {
        xlog("L_WARN", "REGISTRAR: Authentication failed for $au@$fd, rc=$rc\n");
        if ($rc == -1) {
            xlog("L_INFO", "REGISTRAR: Invalid password for $au\n");
        } else if ($rc == -2) {
            xlog("L_ERR", "REGISTRAR: Database error for $au\n");
            sl_send_reply("500", "Internal Server Error");
            exit;
        } else if ($rc == -3) {
            xlog("L_INFO", "REGISTRAR: Stale nonce for $au, re-challenging\n");
        } else if ($rc == -4) {
            xlog("L_INFO", "REGISTRAR: User $au not found in database\n");
        } else if ($rc == -5) {
            xlog("L_ERR", "REGISTRAR: Generic auth error for $au\n");
            sl_send_reply("500", "Internal Server Error");
            exit;
        } else {
            xlog("L_ERR", "REGISTRAR: Unknown auth error rc=$rc for $au\n");
        }
        # All non-database errors: re-challenge
        www_challenge(SIP_REALM, "0");
        exit;
    }

    xlog("L_INFO", "REGISTRAR: Authentication successful for $au\n");
    consume_credentials();

    if ($au != $fU) {
        xlog("L_WARN", "REGISTRAR: Username mismatch - auth_user=$au, from_user=$fU\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    if (!save("location")) {
        xlog("L_ERR", "REGISTRAR: Failed to save location for $fu\n");
        sl_send_reply("500", "Error saving location");
        exit;
    }

    xlog("L_INFO", "REGISTRAR: Successfully registered $fu from $si:$sp\n");
    exit;
}

##############################################################################
# Route: INVITE - Initial INVITE handling
##############################################################################
route[INVITE] {
    xlog("L_INFO", "INVITE to $rU (Call-ID: $ci)\n");

    # Route 999 IVR calls directly to LiveKit-SIP
    if ($rU == "999") {
        xlog("L_INFO", "IVR 999 call - routing to livekit-sip for PIN prompt (Call-ID: $ci)\n");

        # Create dialog to persist variables across the call
        dlg_manage();

        # Query number of VMs from database
        sql_pvquery("db", "SELECT COUNT(DISTINCT setid) FROM dispatcher", "$var(num_vms)");
        if ($var(num_vms) < 1) {
            xlog("L_ERR", "DISPATCHER: No VMs configured in database\n");
            sl_send_reply("503", "Service Unavailable");
            exit;
        }

        # Calculate VM set from timestamp (distributes across N VMs)
        $var(vm_set) = ($Ts mod $var(num_vms)) + 1;

        # Select destination from dispatcher set with fallback
        $var(selected) = 0;
        $var(try_set) = $var(vm_set);
        $var(tried) = 0;

        while ($var(tried) < $var(num_vms) && $var(selected) == 0) {
            if (ds_select_dst($var(try_set), 0)) {
                $var(selected) = 1;
                $var(vm_set) = $var(try_set);
            } else {
                xlog("L_WARN", "DISPATCHER: Set $var(try_set) unavailable\n");
                $var(try_set) = ($var(try_set) mod $var(num_vms)) + 1;
                $var(tried) = $var(tried) + 1;
            }
        }

        if ($var(selected) == 0) {
            xlog("L_ERR", "DISPATCHER: No available servers\n");
            sl_send_reply("503", "Service Unavailable");
            exit;
        }
        xlog("L_INFO", "DISPATCHER: Selected set=$var(vm_set), dst=$du\n");

        # Process SDP with RTPEngine (or mark as delayed offer if no SDP)
        if (has_body("application/sdp")) {
            set_rtpengine_set($var(vm_set));
            $var(rtp_flags) = "replace-origin ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address";
            $var(rtp_result) = rtpengine_manage($var(rtp_flags));
            xlog("L_INFO", "RTPENGINE: set=$var(vm_set), result=$var(rtp_result) (Call-ID: $ci)\n");
            $dlg_var(delayed_offer) = "0";
        } else {
            # Delayed offer (no SDP in INVITE) - will process in onreply_route
            xlog("L_INFO", "DELAYED OFFER: No SDP in INVITE, will process offer in 200 OK (Call-ID: $ci)\n");
            $dlg_var(delayed_offer) = "1";
            set_rtpengine_set($var(vm_set));
        }

        # Store current set in dialog variable (persists across the call) and AVP (for failover)
        $dlg_var(current_set) = $var(vm_set);
        $avp(current_set) = $var(vm_set);
        $avp(num_vms) = $var(num_vms);

        t_on_failure("LIVEKIT_FAILOVER");
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    # Match PIN calls (1-10 digits) and route to LiveKit-SIP
    if ($rU =~ "^[0-9]{1,10}$") {
        $var(pin) = $rU;
        append_hf("X-PIN: $var(pin)\r\n");

        # Create dialog to persist variables across the call
        dlg_manage();

        # Query number of VMs from database (enables hot reload without restart)
        sql_pvquery("db", "SELECT COUNT(DISTINCT setid) FROM dispatcher", "$var(num_vms)");
        if ($var(num_vms) < 1) {
            xlog("L_ERR", "DISPATCHER: No VMs configured in database\n");
            sl_send_reply("503", "Service Unavailable");
            exit;
        }

        # Calculate VM set from timestamp (distributes across N VMs)
        $var(vm_set) = ($Ts mod $var(num_vms)) + 1;

        # Select destination from dispatcher set with fallback
        $var(selected) = 0;
        $var(try_set) = $var(vm_set);
        $var(tried) = 0;

        while ($var(tried) < $var(num_vms) && $var(selected) == 0) {
            if (ds_select_dst($var(try_set), 0)) {
                $var(selected) = 1;
                $var(vm_set) = $var(try_set);
            } else {
                xlog("L_WARN", "DISPATCHER: Set $var(try_set) unavailable\n");
                $var(try_set) = ($var(try_set) mod $var(num_vms)) + 1;
                $var(tried) = $var(tried) + 1;
            }
        }

        if ($var(selected) == 0) {
            xlog("L_ERR", "DISPATCHER: No available servers\n");
            sl_send_reply("503", "Service Unavailable");
            exit;
        }
        xlog("L_INFO", "DISPATCHER: Selected set=$var(vm_set), dst=$du\n");

        # Process SDP with RTPEngine using same set as dispatcher (or mark as delayed offer)
        if (has_body("application/sdp")) {
            set_rtpengine_set($var(vm_set));
            $var(rtp_flags) = "replace-origin ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address";
            $var(rtp_result) = rtpengine_manage($var(rtp_flags));
            xlog("L_INFO", "RTPENGINE: set=$var(vm_set), result=$var(rtp_result) (Call-ID: $ci)\n");
            $dlg_var(delayed_offer) = "0";
        } else {
            # Delayed offer (no SDP in INVITE) - will process in onreply_route
            xlog("L_INFO", "DELAYED OFFER: No SDP in INVITE, will process offer in 200 OK (Call-ID: $ci)\n");
            $dlg_var(delayed_offer) = "1";
            set_rtpengine_set($var(vm_set));
        }

        # Store current set in dialog variable (persists across the call) and AVP (for failover)
        $dlg_var(current_set) = $var(vm_set);
        $avp(current_set) = $var(vm_set);
        $avp(num_vms) = $var(num_vms);

        t_on_failure("LIVEKIT_FAILOVER");
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    # Match phone numbers and route to registered devices
    if ($rU =~ "^\+[0-9]{1,15}$" || $rU =~ "^0[0-9]{9,}$" || $rU =~ "^[0-9]{11,}$") {
        if (lookup("location")) {
            t_relay();
            exit;
        }
        sl_send_reply("404", "Not Found");
        exit;
    }

    sl_send_reply("484", "Address Incomplete");
    exit;
}

##############################################################################
# Failure Route: LIVEKIT_FAILOVER - Handle failed LiveKit-SIP connections
##############################################################################
failure_route[LIVEKIT_FAILOVER] {
    if (t_is_canceled()) exit;

    if (t_check_status("5[0-9][0-9]") || t_branch_timeout()) {
        # Delete RTPEngine session before trying next server
        rtpengine_delete();

        # Get current set and num_vms from AVPs
        $var(current_set) = $avp(current_set);
        $var(num_vms) = $avp(num_vms);
        $var(tried) = 0;

        # Try next available sets (round-robin through all sets)
        while ($var(tried) < $var(num_vms)) {
            $var(current_set) = ($var(current_set) mod $var(num_vms)) + 1;
            $var(tried) = $var(tried) + 1;

            if (ds_select_dst($var(current_set), 0)) {
                xlog("L_INFO", "FAILOVER: Trying set=$var(current_set), dst=$du\n");

                if (has_body("application/sdp")) {
                    set_rtpengine_set($var(current_set));
                    $var(rtp_flags) = "replace-origin ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address";
                    rtpengine_manage($var(rtp_flags));
                }

                $dlg_var(current_set) = $var(current_set);
                $avp(current_set) = $var(current_set);
                t_relay();
                exit;
            }
        }

        xlog("L_ERR", "FAILOVER: All servers unavailable\n");
    }
}

##############################################################################
# Reply Route - Process SIP responses
##############################################################################
onreply_route {
    xlog("L_INFO", "<<< Reply: $rs $rr for $rm (Call-ID: $ci)\n");

    if (is_method("INVITE")) {
        # Rewrite Contact header to use the source IP (internal) instead of public IP
        # This ensures ACK/re-INVITE/BYE reach LiveKit-SIP via the internal network
        if ($rs >= 200 && $rs < 300) {
            fix_nated_contact();
        }

        if (has_body("application/sdp")) {
            # Extract TCP/BFCP port before RTPEngine processing
            $avp(original_bfcp_port) = $null;
            if (search_body("TCP/BFCP")) {
                $var(bfcp_match) = $(rb{re.subst,/.*m=application ([0-9]+) TCP\/BFCP.*/\1/s});
                if ($var(bfcp_match) != $rb) {
                    $avp(original_bfcp_port) = $var(bfcp_match);
                    xlog("L_INFO", "BFCP: Saved original port $avp(original_bfcp_port) before RTPEngine (Call-ID: $ci)\n");
                }
            }

            if ($dlg_var(current_set)) {
                set_rtpengine_set($dlg_var(current_set));
            }
            $var(rtp_flags) = "replace-origin ICE=remove media-handover original-sendrecv rtcp-mux-demux trust-address";

            # Handle delayed offer: 200 OK contains the OFFER (not answer)
            if ($dlg_var(delayed_offer) == "1" && $rs == 200) {
                $var(rtp_result) = rtpengine_offer($var(rtp_flags));
                xlog("L_INFO", "RTPENGINE: delayed offer - 200 OK processed as OFFER (set=$dlg_var(current_set), result=$var(rtp_result), Call-ID: $ci)\n");
            } else {
                $var(rtp_result) = rtpengine_manage($var(rtp_flags));
                xlog("L_INFO", "RTPENGINE: response processed (set=$dlg_var(current_set), result=$var(rtp_result), Call-ID: $ci)\n");
            }

            # Apply RTPEngine changes before BFCP port restoration
            msg_apply_changes();

            # Restore TCP/BFCP port after RTPEngine
            if (search_body("TCP/BFCP")) {
                route(FIX_BFCP);
            }
        }
    }
}

##############################################################################
# Route: FIX_BFCP - Restore TCP/BFCP port and set correct connection address
##############################################################################
route[FIX_BFCP] {
    if (search_body("TCP/BFCP")) {
        # Restore original TCP/BFCP port
        if ($avp(original_bfcp_port) != $null) {
            subst_body("/(m=application )[0-9]+( TCP\/BFCP)/\\1$avp(original_bfcp_port)\\2/g");
            xlog("L_INFO", "BFCP: Restored port to $avp(original_bfcp_port) (Call-ID: $ci)\n");
            msg_apply_changes();
        }

        # Get RTPEngine external IP from database based on current set
        $var(bfcp_ip) = $null;
        if ($dlg_var(current_set) != $null) {
            sql_pvquery("db", "SELECT external_ip FROM rtpengine WHERE setid = $dlg_var(current_set) AND disabled = 0 AND external_ip IS NOT NULL LIMIT 1", "$var(bfcp_ip)");
        }

        # Fallback to advertise IP if no external_ip configured
        if ($var(bfcp_ip) == $null || $var(bfcp_ip) == "") {
            $var(bfcp_ip) = "ADVERTISE_IP";
            xlog("L_WARN", "BFCP: No external_ip in DB for set=$dlg_var(current_set), using ADVERTISE_IP (Call-ID: $ci)\n");
        }

        # Set media-level c= line to RTPEngine external IP
        if (search_body("m=application [0-9]+ TCP/BFCP [^\r\n]*\r\nc=IN IP4")) {
            subst_body("/(m=application [0-9]+ TCP\/BFCP [^\r\n]*\r\n)c=IN IP4 [0-9.]+/\\1c=IN IP4 $var(bfcp_ip)/g");
            xlog("L_INFO", "BFCP: Updated c= to $var(bfcp_ip) (set=$dlg_var(current_set), Call-ID: $ci)\n");
        } else {
            subst_body("/(m=application [0-9]+ TCP\/BFCP [^\r\n]*)/\\1\r\nc=IN IP4 $var(bfcp_ip)/g");
            xlog("L_INFO", "BFCP: Added c= with $var(bfcp_ip) (set=$dlg_var(current_set), Call-ID: $ci)\n");
        }

        msg_apply_changes();
    }
}
