# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# What must exist in Authentik for Meet to sign in (P0-120 step 0b, staging-ovh): replayed on a
# new instance, read, versioned, where an export of its database depends on Authentik's version.
# Mounted by values.authentik.yaml.gotmpl (blueprints.configMaps), applied by the worker on
# discovery and again at each change.
#
# No secret here:
#   - the client secret is the worker's AUTHENTIK_MEET_CLIENT_SECRET, from the Secret
#     authentik-secrets (the same value as Meet's oidc.clientSecret);
#   - the signing key is the certificate-keypair "meet-signing", which Authentik discovers in
#     /certs/meet-signing/ (tls.crt, tls.key), mounted from the Secret authentik-meet-signing.
#     A key pair is found by its name, never written by the blueprint: RS256 for Meet
#     (OIDC_RP_SIGN_ALGO); without it Authentik would sign HS256 with the client secret.
#   - Meet's host is the worker's MEET_HOST.
version: 1
metadata:
  name: P0-120 Meet
  labels:
    blueprints.goauthentik.io/description: OIDC provider and application of Meet (staging-ovh)
entries:
  # The default flows the provider uses: applied first if they are not yet.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: meet-provider
    identifiers:
      name: meet
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: meet
      client_secret: !Env AUTHENTIK_MEET_CLIENT_SECRET
      redirect_uris:
        # mozilla-django-oidc's callback under Meet's api/v1.0/ (core/urls.py).
        - matching_mode: strict
          url: !Format ["https://%s/api/v1.0/callback/", !Env MEET_HOST]
          redirect_uri_type: authorization
        # django-lasuite's logout-callback/, Meet's post-logout redirect.
        - matching_mode: strict
          url: !Format ["https://%s/api/v1.0/logout-callback/", !Env MEET_HOST]
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, meet-signing]]
      # The user's sub stays the same across a restore of the authentik database (backup.sh):
      # Meet keys its users on it.
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      # Meet's OIDC_RP_SCOPES: openid email profile.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  # Its slug is the one in Meet's JWKS and end-session URLs (values.yaml, authentik.slug).
  - model: authentik_core.application
    identifiers:
      slug: meet
    attrs:
      name: Meet
      provider: !KeyOf meet-provider
      meta_launch_url: !Format ["https://%s/", !Env MEET_HOST]
      policy_engine_mode: any
